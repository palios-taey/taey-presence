name: public-clean

# The bar was enforced by memory and got violated by people who could recite it — including hours
# after writing it down. This makes it mechanical: the gate runs on every push and PR, and a
# violation blocks the merge instead of relying on a reviewer noticing.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  public-clean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the history scan needs every commit, not a shallow clone
      - name: Prove drive_chat server-side canonical ref binding
        run: python3 serving/validate_drive_chat_server_ref_binding.py
      - name: Prove LinkedIn Unit 1 isolated one-action profile
        run: python3 serving/validate_linkedin_unit1_profile.py
      - name: Prove autonomous LinkedIn Unit 1 preparation profile
        run: python3 serving/validate_linkedin_unit1_prepare_profile.py
      - name: Prove LinkedIn preparation inference policy
        run: python3 serving/validate_linkedin_prepare_thinking_policy.py
      - name: Prove Greenhouse ATS isolated one-action profile
        run: python3 serving/validate_greenhouse_ats_ui_profile.py
      - name: Prove council prompt/model-request receipt producer
        run: python3 serving/validate_council_prompt_receipt_producer.py
      - name: Prove council recovery outcome anti-forgery contract
        run: python3 serving/validate_council_session_recovery_anti_forgery.py
      - name: Install gitleaks
        # The gate exits 2 (INDETERMINATE) rather than passing if this is missing, so a broken
        # install surfaces as "could not determine" instead of a false clean bill.
        run: |
          curl -sSL -o /tmp/gitleaks.tar.gz \
            https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz
          tar -xzf /tmp/gitleaks.tar.gz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Run public-clean gate
        run: bash serving/check_public_clean.sh .
