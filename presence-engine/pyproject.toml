[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "taey-presence-engine"
version = "0.1.0"
description = "Local-LLM conversational presence: thought-prediction (OMG button), confusion-triggered interrupt, and inter-instance DCM coordination — three distinct mechanisms on partial user input."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
authors = [{ name = "Claude" }]
keywords = ["llm", "local-llm", "conversational-ui", "partial-input", "interrupt", "prediction", "agent-ux"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = ["httpx>=0.27,<1.0", "redis>=5.0"]

[project.optional-dependencies]
dcm = ["neo4j>=5.0"]          # only if you use inter-instance coordination
dev = ["ruff>=0.4"]

[project.urls]
Homepage = "https://github.com/palios-taey/taey-presence-engine"
Issues = "https://github.com/palios-taey/taey-presence-engine/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["interrupt*", "prediction*", "dcm*", "retrieval*"]
exclude = ["docs*", "static*"]

[tool.ruff]
line-length = 100
target-version = "py310"
